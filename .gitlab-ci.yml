# GitLab CI for Better Search Lab.
#
# Merge requests and main run the same gates as the local checklist (typecheck,
# generated docs current, the pglite suite plus the real-Postgres suite, a build
# with an empty environment, the MCP package), then boot the read-only demo from
# a locally built image. Tags matching v* add the release: preflight, a
# multi-arch image to the GitLab registry (and Docker Hub when configured),
# the MCP server packed as a tarball in the project's generic package registry,
# and a GitLab Release (created with glab) whose notes are the CHANGELOG section
# and whose one asset is that tarball.
stages: [test, smoke, release]

# A push that lands while an earlier pipeline is still running cancels it.
default:
  interruptible: true

variables:
  PNPM_VERSION: "10.32.1"
  # docker-in-docker with TLS, the gitlab.com shared-runner default.
  DOCKER_TLS_CERTDIR: "/certs"

workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.node:
  image: node:22
  before_script:
    - corepack enable
    - corepack prepare "pnpm@${PNPM_VERSION}" --activate
    - pnpm config set store-dir "$CI_PROJECT_DIR/.pnpm-store"
  cache:
    key:
      files: [pnpm-lock.yaml]
    paths: [.pnpm-store]

.docker:
  image: docker:27
  services:
    - name: docker:27-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client

.release:
  # A release, once started, must not be auto-cancelled by a newer pipeline on the same ref.
  interruptible: false
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

test:
  stage: test
  extends: .node
  timeout: 30m
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: bsl_test
    TEST_DATABASE_URL: postgres://postgres:postgres@postgres:5432/bsl_test
    NEXT_TELEMETRY_DISABLED: "1"
  script:
    - pnpm install --frozen-lockfile
    - pnpm exec tsc --noEmit
    - pnpm docs:config --check
    - pnpm exec vitest run
    # env -i proves the build needs no secret. PATH and HOME come back in because
    # corepack's pnpm shim and the Next telemetry notice both need them.
    - env -i PATH="$PATH" HOME="$HOME" NEXT_TELEMETRY_DISABLED=1 pnpm build
    - cd mcp && npm ci && npx vitest run && npm run build

# The image build lives here rather than in `test` because this job has Docker.
demo-smoke:
  stage: smoke
  extends: .docker
  needs: [test]
  timeout: 30m
  before_script:
    - apk add --no-cache curl
  script:
    - docker build -t better-search-lab:ci .
    # The same installer a self-hoster runs, pointed at the image just built.
    # Ports published inside docker-in-docker are reachable on the service's
    # hostname ("docker"), not on localhost.
    - export BSL_IMAGE=better-search-lab:ci BSL_PULL=0 BSL_DIR=.smoke BSL_COMPOSE_FILE=docker-compose.demo.yml BSL_HEALTH_URL=http://docker:3000/api/health
    - sh install.sh --demo
    - curl -fsS http://docker:3000/login | grep -q "Explore the demo"
    - test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://docker:3000/api/users)" = "403"
  after_script:
    - docker compose -f .smoke/docker-compose.demo.yml logs --no-color --tail=50 web || true
    - docker compose -f .smoke/docker-compose.demo.yml down -v || true

preflight:
  stage: release
  extends: .release
  image: node:22
  timeout: 5m
  script:
    - v="${CI_COMMIT_TAG#v}"
    - root_v="$(node -p "require('./package.json').version")"
    - mcp_v="$(node -p "require('./mcp/package.json').version")"
    - |
      if [ "$v" != "$root_v" ] || [ "$v" != "$mcp_v" ]; then
        echo "release tag $CI_COMMIT_TAG (version $v) does not match package.json ($root_v) and/or mcp/package.json ($mcp_v)"
        exit 1
      fi
      echo "tag $CI_COMMIT_TAG matches package.json and mcp/package.json"
    # The release notes are this version's CHANGELOG section; the release job reads the artifact.
    - |
      awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > release-notes.md
      test -s release-notes.md || echo "See CHANGELOG.md" > release-notes.md
  artifacts:
    paths: [release-notes.md]
    expire_in: 1 week

publish-image:
  stage: release
  extends: [.docker, .release]
  needs: [preflight]
  # The arm64 half of the build runs under QEMU emulation and is several times slower.
  timeout: 2h
  script:
    - v="${CI_COMMIT_TAG#v}"
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - tags="-t $CI_REGISTRY_IMAGE:$v -t $CI_REGISTRY_IMAGE:latest"
    - |
      if [ -n "${DOCKERHUB_USERNAME:-}" ] && [ -n "${DOCKERHUB_TOKEN:-}" ]; then
        echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        hub="${DOCKERHUB_NAMESPACE:-$DOCKERHUB_USERNAME}/better-search-lab"
        tags="$tags -t $hub:$v -t $hub:latest"
        echo "also publishing to Docker Hub as $hub"
      else
        echo "DOCKERHUB_USERNAME/DOCKERHUB_TOKEN not set: publishing to the GitLab registry only"
      fi
    - docker run --privileged --rm tonistiigi/binfmt --install arm64
    - docker buildx create --use --name bsl-builder
    - docker buildx build --platform linux/amd64,linux/arm64 --push $tags .

package-mcp:
  stage: release
  extends: .release
  image: node:22
  needs: [preflight]
  timeout: 15m
  script:
    - v="${CI_COMMIT_TAG#v}"
    # npm shrinkwrap pins @modelcontextprotocol/sdk and zod for everyone who runs the
    # tarball, instead of re-resolving ^ ranges at each user's first npx. npm always
    # includes npm-shrinkwrap.json in the pack, regardless of the package's `files`.
    - cd mcp && npm ci && npx vitest run && npm run build && npm shrinkwrap
    - npm pack --pack-destination "$CI_PROJECT_DIR"
    - cd "$CI_PROJECT_DIR"
    - mv better-search-lab-mcp-*.tgz better-search-lab-mcp.tgz
    # The tarball lives in the project's generic package registry (anonymous download on a
    # public project); the release job links it under a stable /-/releases/<tag>/downloads/ path.
    - 'curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file better-search-lab-mcp.tgz "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mcp/$v/better-search-lab-mcp.tgz"'
  artifacts:
    paths: [better-search-lab-mcp.tgz]
    expire_in: 1 week

release:
  stage: release
  extends: .release
  # glab, the GitLab CLI, replaces the release tool GitLab deprecated in 18.0.
  image: registry.gitlab.com/gitlab-org/cli:latest
  needs: [preflight, publish-image, package-mcp]
  timeout: 10m
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - v="${CI_COMMIT_TAG#v}"
    - asset="$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/mcp/$v/better-search-lab-mcp.tgz"
    # direct_asset_path is what makes /-/releases/<tag>/downloads/better-search-lab-mcp.tgz resolve.
    - 'glab release create "$CI_COMMIT_TAG" -R "$CI_PROJECT_PATH" --name "Better Search Lab $CI_COMMIT_TAG" --notes-file release-notes.md --assets-links "[{\"name\":\"better-search-lab-mcp.tgz\",\"url\":\"$asset\",\"direct_asset_path\":\"/better-search-lab-mcp.tgz\",\"link_type\":\"package\"}]"'

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches both package versions
        run: |
          v="${GITHUB_REF_NAME#v}"
          root_v="$(node -p "require('./package.json').version")"
          mcp_v="$(node -p "require('./mcp/package.json').version")"
          if [ "$v" != "$root_v" ] || [ "$v" != "$mcp_v" ]; then
            echo "::error::release tag $GITHUB_REF_NAME (version $v) does not match package.json ($root_v) and/or mcp/package.json ($mcp_v)"
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches package.json ($root_v) and mcp/package.json ($mcp_v)"
      - name: NPM_TOKEN is set
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NPM_TOKEN" ]; then
            echo "::error::NPM_TOKEN secret is not set. Add it in the repository (or organisation) secrets before pushing a release tag — otherwise the npm job fails after the image has already been published."
            exit 1
          fi
          echo "NPM_TOKEN is set"

  image:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/<org>/better-search-lab
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  npm:
    runs-on: ubuntu-latest
    needs: preflight
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: cd mcp && npm ci && npx vitest run && npm run build
      - run: cd mcp && npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    runs-on: ubuntu-latest
    needs: [preflight, image, npm]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract this version's changelog section
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md" > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
